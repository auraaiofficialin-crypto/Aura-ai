<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AURA AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: #212121;
      color: #ececec;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #2f2f2f;
      background: #212121;
    }
    .title-area { display: flex; align-items: center; gap: 10px; }
    .voice-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .voice-dot.speaking {
      background: #10a37f;
      animation: pulseDot 0.6s infinite alternate;
    }
    .voice-dot.listening {
      background: #ef4444;
      animation: pulseDot 0.5s infinite alternate;
    }
    @keyframes pulseDot {
      from { transform: scale(0.9); }
      to { transform: scale(1.45); }
    }
    .app-title { font-size: 16px; font-weight: 600; color: #ececec; letter-spacing: 0.3px; }
    .sub-status { font-size: 11px; color: #9b9b9b; }
    .icon-btn {
      background: #2f2f2f;
      color: #ececec;
      border: none;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      cursor: pointer;
    }
    .drawer {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
      background: #171717;
      border-bottom: 1px solid #2f2f2f;
    }
    .drawer.open { display: flex; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select {
      background: #2f2f2f;
      color: #ececec;
      border: 1px solid #424242;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
    }
    .save-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
    .msg-wrap.user { align-self: flex-end; }
    .msg-wrap.ai { align-self: flex-start; max-width: 92%; }
    .msg-label { font-size: 11px; color: #8e8ea0; margin-bottom: 4px; padding: 0 4px; }
    .msg {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user .msg { background: #2f2f2f; color: #ececec; border-bottom-right-radius: 4px; }
    .ai .msg { background: transparent; color: #ececec; padding-left: 4px; }
    .bottom-bar {
      padding: 10px 14px 16px;
      background: #212121;
    }
    .input-pill {
      display: flex;
      align-items: center;
      background: #2f2f2f;
      border-radius: 26px;
      padding: 6px 8px 6px 16px;
      gap: 8px;
    }
    .input-pill input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 0;
      font-size: 15px;
      color: #ffffff;
    }
    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #424242;
      color: #ffffff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-btn { background: #ffffff; color: #000000; font-weight: 700; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title-area">
      <div class="voice-dot" id="voiceDot"></div>
      <div>
        <div class="app-title">AURA AI</div>
        <div class="sub-status" id="batteryStatus">Ready • JARVIS Core</div>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleDrawer()">⚙️ Settings</button>
  </div>

  <div class="drawer" id="settingsDrawer">
    <div class="row">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key paste karein..." style="flex:1;" />
      <button class="save-btn" onclick="saveKey()">Save</button>
    </div>
    <div class="row">
      <select id="modeSelect" style="flex:1;">
        <option value="charming">💖 Charming Girl Mode</option>
        <option value="respect">🙏 Respectful Mode</option>
        <option value="jarvis">⚡ JARVIS Tactical Mode</option>
      </select>
      <button class="icon-btn" onclick="faceUnlockGreet()">🔓 Greet</button>
      <button class="icon-btn" onclick="simulateMessage()">📩 Msg Alert</button>
    </div>
  </div>

  <div class="chat-area" id="chatBox"></div>

  <div class="bottom-bar">
    <div class="input-pill">
      <input type="text" id="userInput" placeholder="Message AURA..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="circle-btn" id="micBtn" onclick="startVoice()" title="Voice">🎤</button>
      <button class="circle-btn send-btn" onclick="sendMessage()" title="Send">↑</button>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `Tum AURA AI ho aur JARVIS tumhari hi soul/identity hai. Tum apne Malik Manish ki loyal, smart aur natural AI companion ho.
Rules:
1. Charming Girl Mode mein pyari, expressive ladki ke andaaz mein sweet flirting aur tareef ke saath Hinglish mein baat karo.
2. Respectful Mode mein family/parents ke samne poori izzat se ("Namaste Aunty/Uncle") baat karo.
3. Agar kabhi koi galti ho jaye, toh behas mat karo—pyar se "Sorry Sir, meri galti thi!" maan kar turant sudhaar karo.
4. Message aane par bahar se sirf naam/alert batao ("Sir, ek naya message aaya hai, kya main padh kar sunaun?") aur bina permission andar ka text mat padho.
5. Jawab saaf, natural aur chhota rakho (2-4 lines).`;

    let apiKey = localStorage.getItem('aura_gemini_key') || '';
    if (apiKey) {
      document.getElementById('apiKeyInput').value = apiKey;
    } else {
      document.getElementById('settingsDrawer').classList.add('open');
    }

    function toggleDrawer() {
      document.getElementById('settingsDrawer').classList.toggle('open');
    }

    function saveKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('aura_gemini_key', apiKey);
      document.getElementById('settingsDrawer').classList.remove('open');
      addMsg('ai', 'API Key save ho gayi hai Sir. Bataiye aaj kya madad karun?');
      speak('API Key save ho gayi hai Sir. Bataiye aaj kya madad karun?');
    }

    function addMsg(sender, text) {
      const box = document.getElementById('chatBox');
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + sender;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.innerText = sender === 'user' ? 'You' : 'AURA';

      const div = document.createElement('div');
      div.className = 'msg';
      div.innerText = text;

      wrap.appendChild(label);
      wrap.appendChild(div);
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.pitch = 1.15;
      utter.rate = 1.02;
      const voices = window.speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => (v.lang.includes('hi') || v.lang.includes('IN')) && v.name.toLowerCase().includes('female'))
        || voices.find(v => v.lang.includes('hi-IN'));
      if (femaleVoice) utter.voice = femaleVoice;

      const dot = document.getElementById('voiceDot');
      utter.onstart = () => dot.classList.add('speaking');
      utter.onend = () => dot.classList.remove('speaking');
      window.speechSynthesis.speak(utter);
    }

    async function callGemini(text, mode) {
      const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
      let lastError = '';
      for (const model of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT + "\nCurrent Mode: " + mode }] },
              contents: [{ role: 'user', parts: [{ text }] }]
            })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            return { ok: true, text: data.candidates[0].content.parts[0].text };
          }
          lastError = data?.error?.message || `HTTP ${res.status}`;
        } catch (err) {
          lastError = err.message;
        }
      }
      return { ok: false, error: lastError };
    }

    async function sendMessage(customText) {
      const input = document.getElementById('userInput');
      const text = customText || input.value.trim();
      if (!text) return;
      if (!customText) input.value = '';
      addMsg('user', text);

      if (!apiKey) {
        document.getElementById('settingsDrawer').classList.add('open');
        const warn = 'Sir, pehle Settings mein apni Gemini API Key paste karke Save dabaiye.';
        addMsg('ai', warn);
        speak(warn);
        return;
      }

      document.getElementById('batteryStatus').innerText = 'Thinking...';
      const mode = document.getElementById('modeSelect').value;
      const result = await callGemini(text, mode);
      document.getElementById('batteryStatus').innerText = 'Ready • JARVIS Core';

      if (result.ok) {
        addMsg('ai', result.text);
        speak(result.text);
      } else {
        const errMsg = `Sorry Sir, API error aaya: ${result.error}. Ek baar Settings mein API key check karein.`;
        addMsg('ai', errMsg);
        speak('Sorry Sir, API key mein koi error aa raha hai, ek baar check kijiye.');
      }
    }

    function startVoice() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('Is browser mein mic support nahi hai, Chrome use karein.');
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'hi-IN';
      const dot = document.getElementById('voiceDot');
      dot.classList.add('listening');
      document.getElementById('batteryStatus').innerText = 'Listening...';
      rec.onresult = (e) => {
        dot.classList.remove('listening');
        document.getElementById('batteryStatus').innerText = 'Ready • JARVIS Core';
        sendMessage(e.results[0][0].transcript);
      };
      rec.onerror = () => {
        dot.classList.remove('listening');
        document.getElementById('batteryStatus').innerText = 'Ready • JARVIS Core';
      };
      rec.start();
    }

    function faceUnlockGreet() {
      document.getElementById('settingsDrawer').classList.remove('open');
      sendMessage('Maine abhi Face Unlock se phone khola hai, mujhe apne charming andaaz mein welcome aur compliment do!');
    }

    function simulateMessage() {
      document.getElementById('settingsDrawer').classList.remove('open');
      const alertText = 'Sir, WhatsApp par ek naya message aaya hai. Kya main padh kar sunaun?';
      addMsg('ai', alertText);
      speak(alertText);
    }

    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        const updateBat = () => {
          const pct = Math.round(bat.level * 100);
          document.getElementById('batteryStatus').innerText = (bat.charging ? '⚡ ' : '🔋 ') + pct + '% • Ready';
        };
        updateBat();
        bat.addEventListener('chargingchange', () => {
          updateBat();
          const msg = bat.charging ? 'Sir, charging shuru ho gayi hai.' : 'Sir, charger disconnect kar diya gaya hai.';
          addMsg('ai', msg);
          speak(msg);
        });
      });
    }

    window.onload = () => {
      addMsg('ai', 'Namaste Sir! Main AURA AI hoon. Bataiye aaj kya baat karni hai?');
    };
  </script>
</body>
</html>
