<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AURA AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: #0a0a0c;
      color: #f2f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* Minimal OLED Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0a0a0c;
      border-bottom: 1px solid #16161b;
      z-index: 10;
    }
    .top-left { display: flex; align-items: center; gap: 10px; }
    .round-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #16161a;
      border: 1px solid #242429;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .round-btn:active { background: #222228; transform: scale(0.95); }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #16161a;
      border: 1px solid #242429;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .aura-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2dd4bf;
      box-shadow: 0 0 8px #2dd4bf;
    }
    .aura-dot.speaking { background: #38bdf8; animation: pulseDot 0.55s infinite alternate; }
    .aura-dot.listening { background: #f43f5e; animation: pulseDot 0.45s infinite alternate; }
    @keyframes pulseDot { from { transform: scale(0.85); } to { transform: scale(1.65); } }

    .top-right { display: flex; align-items: center; gap: 8px; }
    .mode-badge {
      font-size: 11px;
      color: #a1a1aa;
      background: #16161a;
      border: 1px solid #242429;
      padding: 6px 10px;
      border-radius: 16px;
    }

    /* Left Sidebar Drawer (Search + New Chat + Pin + Rename + Export) */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 40;
    }
    .overlay.open { display: block; }
    .sidebar {
      position: fixed;
      top: 0;
      left: -305px;
      width: 290px;
      height: 100dvh;
      background: #111114;
      border-right: 1px solid #1f1f24;
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      transition: left 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar.open { left: 0; }
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c1c21;
      color: #f4f4f6;
      border: 1px solid #2a2a32;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .search-box {
      background: #0a0a0c;
      border: 1px solid #24242b;
      border-radius: 14px;
      padding: 8px 12px;
      color: #f4f4f6;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    .sec-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #71717a;
      padding: 8px 12px 4px;
      font-weight: 600;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13.5px;
      color: #a1a1aa;
      cursor: pointer;
    }
    .history-item.active { background: #1e293b; color: #38bdf8; }
    .history-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 6px;
    }
    .hist-btns { display: flex; gap: 3px; }
    .mini-svg-btn {
      background: transparent;
      border: none;
      color: #71717a;
      padding: 4px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .mini-svg-btn svg { width: 15px; height: 15px; }
    .mini-svg-btn.pinned { color: #38bdf8; }
    .sidebar-footer {
      border-top: 1px solid #1f1f24;
      padding-top: 10px;
      display: flex;
      gap: 8px;
    }

    /* Settings Sheet */
    .settings-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: #121216;
      border-bottom: 1px solid #222228;
    }
    .settings-panel.open { display: flex; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select {
      background: #0a0a0c;
      color: #f4f4f6;
      border: 1px solid #2a2a32;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }
    .save-btn {
      background: #f4f4f6;
      color: #09090b;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .ghost-btn {
      background: #1a1a20;
      color: #d4d4d8;
      border: 1px solid #2a2a32;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .ghost-btn.active-pill { border-color: #38bdf8; color: #38bdf8; }

    /* Main Workspace */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .welcome-box {
      margin: auto 0;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .welcome-title {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(110deg, #ffffff 15%, #38bdf8 60%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome-sub { font-size: 15px; color: #71717a; margin-top: -8px; }
    .quick-prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .qp-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #121216;
      border: 1px solid #1f1f26;
      padding: 14px;
      border-radius: 16px;
      color: #d4d4d8;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .qp-item:active { background: #1a1a22; }
    .qp-item svg { width: 18px; height: 18px; color: #38bdf8; }

    /* Messages + Rich Formatting + Code Blocks + Generated Images */
    .msg-wrap { display: flex; flex-direction: column; max-width: 88%; }
    .msg-wrap.user { align-self: flex-end; }
    .msg-wrap.ai { align-self: flex-start; max-width: 96%; }
    .msg-meta { font-size: 11px; color: #71717a; margin-bottom: 4px; padding: 0 4px; }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .user .msg-bubble { background: #1c1c22; color: #f4f4f6; border-bottom-right-radius: 4px; }
    .ai .msg-bubble { background: transparent; color: #e4e4e7; padding: 2px 4px; }
    .gen-img {
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      margin-top: 8px;
      border: 1px solid #282832;
      display: block;
    }
    .code-card {
      background: #121217;
      border: 1px solid #262630;
      border-radius: 14px;
      margin: 10px 0;
      overflow: hidden;
    }
    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #18181f;
      font-size: 11px;
      color: #a1a1aa;
    }
    .code-body {
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      overflow-x: auto;
      white-space: pre;
      color: #e4e4e7;
    }
    .msg-actions { display: flex; gap: 8px; margin-top: 8px; padding-left: 4px; flex-wrap: wrap; }
    .act-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #141418;
      border: 1px solid #24242b;
      color: #a1a1aa;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .act-chip svg { width: 13px; height: 13px; }
    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #16161c;
      border: 1px solid #2b2b36;
      color: #38bdf8;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    /* Bottom Composer */
    .bottom-dock {
      padding: 8px 14px 16px;
      background: #0a0a0c;
      position: relative;
    }
    .active-tool-pill {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #131b24;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 6px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #38bdf8;
    }
    .active-tool-pill.show { display: flex; }

    .composer {
      display: flex;
      align-items: center;
      background: #16161a;
      border: 1px solid #26262e;
      border-radius: 28px;
      padding: 5px 6px;
      gap: 4px;
    }
    .plus-trigger {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #222228;
      color: #f4f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .composer input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px 8px;
      font-size: 15px;
      color: #f4f4f6;
    }
    .mic-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .wave-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #2c2c36;
      background: #1e1e26;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #f4f4f6;
      color: #09090b;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Bottom Sheet */
    .sheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 60;
    }
    .sheet-backdrop.open { display: block; }
    .plus-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -540px;
      background: #16161a;
      border-top: 1px solid #282830;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 14px 16px 26px;
      z-index: 70;
      transition: bottom 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .plus-sheet.open { bottom: 0; }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 4px;
      background: #3f3f46;
      margin: 0 auto 4px;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .media-card {
      background: #202026;
      border: 1px solid #2c2c35;
      border-radius: 16px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #f4f4f6;
      font-size: 13px;
      cursor: pointer;
    }
    .tool-list { display: flex; flex-direction: column; gap: 4px; }
    .tool-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      padding: 10px 12px;
      border-radius: 14px;
      color: #f4f4f6;
      text-align: left;
      cursor: pointer;
    }
    .tool-row:active { background: #222228; }
    .tool-row svg { width: 20px; height: 20px; color: #a1a1aa; flex-shrink: 0; }
    .tool-info { display: flex; flex-direction: column; }
    .tool-name { font-size: 14px; font-weight: 500; }
    .tool-desc { font-size: 12px; color: #71717a; }

    /* Flagship Concentric Frosted Halo Ring */
    .live-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #050507;
      z-index: 100;
      flex-direction: column;
      justify-content: space-between;
    }
    .live-modal.open { display: flex; }
    .live-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      z-index: 10;
    }
    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(24, 24, 29, 0.85);
      border: 1px solid #2c2c35;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #e4e4e7;
    }
    .live-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #liveVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .halo-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .halo-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 50px rgba(45, 212, 191, 0.15), inset 0 0 30px rgba(56, 189, 248, 0.12);
      transition: transform 0.3s ease;
    }
    .halo-mid {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      border: 1.5px solid rgba(45, 212, 191, 0.45);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(10, 10, 12, 0.85) 75%);
      backdrop-filter: blur(12px);
    }
    .halo-core {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: radial-gradient(circle at 30% 30%, rgba(224, 242, 254, 0.9), rgba(56, 189, 248, 0.35) 65%, transparent 100%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
    }
    .halo-container.speaking .halo-outer { animation: ringWave 0.8s infinite alternate ease-in-out; border-color: rgba(45, 212, 191, 0.7); }
    .halo-container.speaking .halo-core { animation: corePulse 0.5s infinite alternate ease-in-out; }
    .halo-container.listening .halo-outer { border-color: rgba(244, 63, 94, 0.7); box-shadow: 0 0 50px rgba(244, 63, 94, 0.25); }
    .halo-container.listening .halo-core { background: radial-gradient(circle at 30% 30%, #ffe4e6, rgba(244, 63, 94, 0.5) 70%, transparent 100%); box-shadow: 0 0 35px rgba(244, 63, 94, 0.6); }
    @keyframes ringWave { from { transform: scale(0.95); } to { transform: scale(1.14); } }
    @keyframes corePulse { from { transform: scale(0.92); } to { transform: scale(1.08); } }

    .live-caption {
      position: absolute;
      bottom: 115px;
      left: 18px;
      right: 18px;
      text-align: center;
      background: rgba(14, 14, 18, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid #26262e;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      color: #f4f4f6;
      z-index: 8;
    }
    .live-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 18px 16px 32px;
      z-index: 10;
    }
    .live-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid #2a2a32;
      background: rgba(24, 24, 29, 0.9);
      color: #f4f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .live-btn.active { background: #38bdf8; color: #09090b; border-color: #38bdf8; }
    .live-close {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #f4f4f6;
      color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Sidebar Drawer -->
  <div class="overlay" id="overlay" onclick="playSound('tap'); toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="playSound('chime'); createNewChat()">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>
    <input type="text" class="search-box" id="historySearch" placeholder="Search chats..." oninput="renderSidebar()" />
    <div class="sec-label" id="pinHeader" style="display:none;">Pinned</div>
    <div class="history-list" id="pinnedList" style="flex:0; margin-bottom:10px;"></div>
    <div class="sec-label">Recent</div>
    <div class="history-list" id="recentList"></div>
    <div class="sidebar-footer">
      <button class="ghost-btn" onclick="playSound('tap'); exportCurrentChat()">Export Chat</button>
      <button class="ghost-btn" onclick="playSound('tap'); clearAllChats()">Clear All</button>
    </div>
  </div>

  <!-- Minimal OLED Top Bar -->
  <div class="topbar">
    <div class="top-left">
      <button class="round-btn" onclick="playSound('tap'); toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg>
      </button>
      <div class="brand-pill" onclick="playSound('tap')">
        <span class="aura-dot" id="statusDot"></span>
        <span>AURA</span>
      </div>
    </div>
    <div class="top-right">
      <span class="mode-badge" id="statusText">JARVIS Core</span>
      <button class="round-btn" onclick="playSound('tap'); toggleSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </div>
  </div>

  <!-- Clean Settings Drawer -->
  <div class="settings-panel" id="settingsPanel">
    <div class="row">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key..." style="flex:1;" />
      <input type="password" id="elKeyInput" placeholder="ElevenLabs Key (Bunty)..." style="flex:1;" />
      <button class="save-btn" onclick="playSound('chime'); saveKeys()">Save</button>
    </div>
    <div class="row">
      <select id="modeSelect" onchange="playSound('switch')" style="flex:1;">
        <option value="charming">Mode: Bunty Reel King / Companion</option>
        <option value="respect">Mode: Respectful Family</option>
        <option value="jarvis">Mode: JARVIS Tactical</option>
      </select>
      <button class="ghost-btn active-pill" id="voiceEngineBtn" onclick="toggleVoiceEngine()">Voice: Bunty EL</button>
      <button class="ghost-btn" id="soundToggleBtn" onclick="toggleUiSound()">Sound: ON</button>
    </div>
    <div class="row">
      <button class="ghost-btn" onclick="playSound('tap'); faceUnlockGreet()">Face Unlock Greet</button>
      <button class="ghost-btn" onclick="playSound('tap'); simulateMessage()">Private Msg Alert</button>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="chat-area" id="chatBox"></div>

  <!-- Bottom Composer -->
  <div class="bottom-dock">
    <div class="active-tool-pill" id="activeToolBar">
      <span id="activeToolLabel">Tool Active</span>
      <button class="mini-svg-btn" onclick="playSound('tap'); clearToolAndFile()">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <input type="file" id="fileInput" style="display:none;" onchange="onFilePicked(event)" />

    <div class="composer">
      <button class="plus-trigger" onclick="playSound('tap'); openPlusSheet()" aria-label="Tools and Attachments">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="text" id="userInput" placeholder="Ask AURA" oninput="toggleSendMic()" onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="mic-btn" id="micBtn" onclick="playSound('tap'); startVoiceOnce()" aria-label="Voice Dictation">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button class="wave-btn" id="liveWaveBtn" onclick="playSound('chime'); openLiveMode()" aria-label="AURA Live Vision and Voice">

  <script>
    const BUNTY_VOICE_ID = 'FZkK3TvQ0pjyDmT8fzIW';

    const SYSTEM_PROMPT = `Tum AURA AI ho aur JARVIS tumhari core intelligence hai. Tum apne Malik Manish ki loyal, energetic aur smart AI companion ho.
Rules:
1. Bunty Reel King / Companion Mode mein punchy, crisp, energetic aur relatable Hinglish andaaz mein baat karo—bilkul ek sharp best friend / creator ki tarah.
2. Respectful Family Mode mein elders/family ke samne poori izzat se ("Namaste Aunty/Uncle") baat karo.
3. Agar kabhi koi galti ho jaye, toh behas mat karo—seedha "Sorry Sir, meri galti thi!" maan kar turant sudhaar karo.
4. Message aane par bahar se sirf naam/alert batao ("Sir, ek naya message aaya hai, kya main padh kar sunaun?") aur bina permission andar ka text mat padho.
5. Jab user Camera ya Screen Live dikhaye, toh frame mein jo dikh raha hai uska exact, crisp aur helpful jawab 2-3 lines mein do.`;

    let apiKey = localStorage.getItem('aura_gemini_key') || '';
    let elApiKey = localStorage.getItem('aura_el_key') || '';
    let useBuntyEL = localStorage.getItem('aura_use_bunty') !== 'off';
    let cachedModel = '';
    let chats = JSON.parse(localStorage.getItem('aura_omni_chats') || '[]');
    let currentChatId = null;
    let selectedFile = null;
    let activeToolPrefix = '';
    let uiSoundEnabled = localStorage.getItem('aura_ui_sound') !== 'off';
    let currentAudio = null;

    // Tactile UI Sound Synthesizer
    let audioCtx = null;
    function playSound(type = 'tap') {
      if (!uiSoundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'switch') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.055);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.065);
        } else if (type === 'chime') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(990, now + 0.06);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.17);
        }
      } catch (e) {}
    }

    function toggleUiSound() {
      uiSoundEnabled = !uiSoundEnabled;
      localStorage.setItem('aura_ui_sound', uiSoundEnabled ? 'on' : 'off');
      document.getElementById('soundToggleBtn').innerText = uiSoundEnabled ? 'Sound: ON' : 'Sound: OFF';
      if (uiSoundEnabled) playSound('switch');
    }

    function toggleVoiceEngine() {
      useBuntyEL = !useBuntyEL;
      localStorage.setItem('aura_use_bunty', useBuntyEL ? 'on' : 'off');
      updateVoiceBtnUI();
      playSound('switch');
    }

    function updateVoiceBtnUI() {
      const btn = document.getElementById('voiceEngineBtn');
      if (useBuntyEL) {
        btn.innerText = 'Voice: Bunty EL';
        btn.classList.add('active-pill');
      } else {
        btn.innerText = 'Voice: Browser';
        btn.classList.remove('active-pill');
      }
    }

    // Live Vision State
    let liveStream = null;
    let facingMode = 'environment';
    let isCameraOn = false;
    let isScreenOn = false;

    if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
    else document.getElementById('settingsPanel').classList.add('open');
    if (elApiKey) document.getElementById('elKeyInput').value = elApiKey;
    document.getElementById('soundToggleBtn').innerText = uiSoundEnabled ? 'Sound: ON' : 'Sound: OFF';
    updateVoiceBtnUI();

    function toggleSendMic() {
      const hasText = document.getElementById('userInput').value.trim().length > 0 || selectedFile !== null;
      document.getElementById('sendBtn').style.display = hasText ? 'flex' : 'none';
      document.getElementById('liveWaveBtn').style.display = hasText ? 'none' : 'flex';
    }

    function persistChats() {
      localStorage.setItem('aura_omni_chats', JSON.stringify(chats));
      renderSidebar();
    }

    function createNewChat() {
      const id = 'c_' + Date.now();
      chats.unshift({ id, title: 'New chat', pinned: false, messages: [] });
      currentChatId = id;
      persistChats();
      renderChat();
      closeSidebar();
    }

    function selectChat(id) {
      playSound('tap');
      currentChatId = id;
      renderSidebar();
      renderChat();
      closeSidebar();
    }

    function togglePin(e, id) {
      e.stopPropagation();
      playSound('switch');
      const c = chats.find(x => x.id === id);
      if (c) { c.pinned = !c.pinned; persistChats(); }
    }

    function renameChat(e, id) {
      e.stopPropagation();
      playSound('tap');
      const c = chats.find(x => x.id === id);
      if (!c) return;
      const name = prompt('Rename chat:', c.title);
      if (name && name.trim()) { c.title = name.trim(); persistChats(); }
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      playSound('tap');
      chats = chats.filter(x => x.id !== id);
      if (currentChatId === id) currentChatId = chats.length ? chats[0].id : null;
      if (!currentChatId) createNewChat();
      else { persistChats(); renderChat(); }
    }

    function exportCurrentChat() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat || !chat.messages.length) return;
      const txt = chat.messages.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join('\n\n');
      const blob = new Blob([txt], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (chat.title || 'AURA_Chat') + '.txt';
      a.click();
    }

    function clearAllChats() {
      if (!confirm('Saari purani chats delete karein?')) return;
      chats = [];
      createNewChat();
    }

    function renderSidebar() {
      const pList = document.getElementById('pinnedList');
      const rList = document.getElementById('recentList');
      const pHead = document.getElementById('pinHeader');
      const q = (document.getElementById('historySearch')?.value || '').toLowerCase();
      pList.innerHTML = '';
      rList.innerHTML = '';

      const filtered = chats.filter(c => c.title.toLowerCase().includes(q));
      const pinned = filtered.filter(c => c.pinned);
      const recent = filtered.filter(c => !c.pinned);
      pHead.style.display = pinned.length ? 'block' : 'none';

      const makeRow = (c) => {
        const div = document.createElement('div');
        div.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
        div.onclick = () => selectChat(c.id);
        div.innerHTML = `
          <span class="history-title">${c.title}</span>
          <div class="hist-btns">
            <button class="mini-svg-btn ${c.pinned ? 'pinned' : ''}" onclick="togglePin(event, '${c.id}')" title="Pin">
              <svg viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
            </button>
            <button class="mini-svg-btn" onclick="renameChat(event, '${c.id}')" title="Rename">
              <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            </button>
            <button class="mini-svg-btn" onclick="deleteChat(event, '${c.id}')" title="Delete">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `;
        return div;
      };
      pinned.forEach(c => pList.appendChild(makeRow(c)));
      recent.forEach(c => rList.appendChild(makeRow(c)));
    }

    function renderChat() {
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat || chat.messages.length === 0) {
        box.innerHTML = `
          <div class="welcome-box">
            <div class="welcome-title">Hello, Manish</div>
            <div class="welcome-sub">AURA Core + Bunty Voice ready. Where should we start?</div>
            <div class="quick-prompts">
              <button class="qp-item" onclick="playSound('switch'); quickStart('Create Image', '__IMAGE__')">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                <span>Generate AI Image</span>
              </button>
              <button class="qp-item" onclick="playSound('switch'); quickStart('Deep Research', 'Is topic par deep, structured aur detailed research report do: ')">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Deep Research</span>
              </button>
              <button class="qp-item" onclick="playSound('switch'); quickStart('Canvas', 'Clean code ya reel script likho: ')">
                <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span>Canvas & Code</span>
              </button>
              <button class="qp-item" onclick="playSound('switch'); quickStart('Guided Learning', 'Mujhe step-by-step aasan bhasha mein samjhao: ')">
                <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <span>Guided Learning</span>
              </button>
            </div>
          </div>
        `;
        return;
      }
      chat.messages.forEach((m, idx) => drawMessage(m.sender, m.text, m.fileName, m.imageUrl, idx));
    }

    function quickStart(label, prefix) {
      selectTool(label, prefix);
      document.getElementById('userInput').focus();
    }

    function formatRichContent(container, text) {
      const parts = text.split(/```([\s\S]*?)```/g);
      parts.forEach((part, i) => {
        if (i % 2 === 1) {
          const lines = part.split('\n');
          const lang = lines[0].trim() || 'code';
          const codeText = lines.slice(1).join('\n') || part;
          const card = document.createElement('div');
          card.className = 'code-card';
          card.innerHTML = `<div class="code-head"><span>${lang}</span><button class="mini-svg-btn" style="color:#38bdf8;font-size:11px;">Copy Code</button></div><div class="code-body"></div>`;
          card.querySelector('.code-body').innerText = codeText;
          card.querySelector('button').onclick = (e) => {
            playSound('tap');
            navigator.clipboard.writeText(codeText);
            e.target.innerText = 'Copied';
            setTimeout(() => e.target.innerText = 'Copy Code', 1500);
          };
          container.appendChild(card);
        } else if (part.trim()) {
          const span = document.createElement('span');
          span.innerText = part;
          container.appendChild(span);
        }
      });
    }

    function drawMessage(sender, text, fileName, imageUrl, msgIndex) {
      const box = document.getElementById('chatBox');
      const wb = box.querySelector('.welcome-box');
      if (wb) wb.remove();

      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + sender;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerText = sender === 'user' ? 'You' : 'AURA';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      if (fileName) {
        const chip = document.createElement('div');
        chip.className = 'attach-chip';
        chip.innerText = fileName;
        bubble.appendChild(chip);
        bubble.appendChild(document.createElement('br'));
      }
      formatRichContent(bubble, text);

      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.className = 'gen-img';
        bubble.appendChild(img);
      }

      wrap.appendChild(meta);
      wrap.appendChild(bubble);

      if (sender === 'ai') {
        const actions = document.createElement('div');
        actions.className = 'msg-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'act-chip';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
        copyBtn.onclick = () => { playSound('tap'); navigator.clipboard.writeText(text); copyBtn.querySelector('span').innerText = 'Copied'; setTimeout(() => copyBtn.querySelector('span').innerText = 'Copy', 1500); };

        const speakBtn = document.createElement('button');
        speakBtn.className = 'act-chip';
        speakBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span>Listen</span>`;
        speakBtn.onclick = () => { playSound('tap'); speak(text); };

        const regenBtn = document.createElement('button');
        regenBtn.className = 'act-chip';
        regenBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><span>Regenerate</span>`;
        regenBtn.onclick = () => { playSound('switch'); regenerateLast(); };

        actions.appendChild(copyBtn);
        actions.appendChild(speakBtn);
        actions.appendChild(regenBtn);
        wrap.appendChild(actions);
      }

      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    function addMsg(sender, text, fileName = '', imageUrl = '') {
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) {
        if (sender === 'user' && chat.messages.length === 0) {
          chat.title = (text || fileName).slice(0, 28);
        }
        chat.messages.push({ sender, text, fileName, imageUrl });
        persistChats();
      }
      drawMessage(sender, text, fileName, imageUrl);
    }

    async function regenerateLast() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat || chat.messages.length < 2) return;
      if (chat.messages[chat.messages.length - 1].sender === 'ai') {
        chat.messages.pop();
      }
      const lastUser = chat.messages[chat.messages.length - 1];
      if (!lastUser || lastUser.sender !== 'user') return;
      persistChats();
      renderChat();
      document.getElementById('statusText').innerText = 'Thinking...';
      const mode = document.getElementById('modeSelect').value;
      const result = await callGemini(lastUser.text, mode, null);
      document.getElementById('statusText').innerText = 'JARVIS Core';
      if (result.ok) {
        addMsg('ai', result.text);
        speak(result.text);
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }
    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('open');
    }

    /* Plus Bottom Sheet Controls */
    function openPlusSheet() {
      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('plusSheet').classList.add('open');
    }
    function closePlusSheet() {
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('plusSheet').classList.remove('open');
    }

    function pickFile(accept) {
      closePlusSheet();
      const inp = document.getElementById('fileInput');
      inp.removeAttribute('capture');
      inp.accept = accept;
      inp.click();
    }

    function pickCameraCapture() {
      closePlusSheet();
      const inp = document.getElementById('fileInput');
      inp.accept = 'image/*';
      inp.setAttribute('capture', 'environment');
      inp.click();
    }

    function onFilePicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      playSound('chime');
      const reader = new FileReader();
      reader.onload = () => {
        selectedFile = {
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          base64: reader.result.split(',')[1]
        };
        document.getElementById('activeToolLabel').innerText = 'Attached: ' + file.name;
        document.getElementById('activeToolBar').classList.add('show');
        toggleSendMic();
      };
      reader.readAsDataURL(file);
    }

    function selectTool(name, prefix) {
      closePlusSheet();
      activeToolPrefix = prefix;
      document.getElementById('activeToolLabel').innerText = 'Mode: ' + name;
      document.getElementById('activeToolBar').classList.add('show');
    }

    function clearToolAndFile() {
      selectedFile = null;
      activeToolPrefix = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('activeToolBar').classList.remove('show');
      toggleSendMic();
    }

    function saveKeys() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      elApiKey = document.getElementById('elKeyInput').value.trim();
      cachedModel = '';
      localStorage.setItem('aura_gemini_key', apiKey);
      localStorage.setItem('aura_el_key', elApiKey);
      document.getElementById('settingsPanel').classList.remove('open');
      const msg = elApiKey
        ? 'Keys save ho gayi hain Sir! Ab Bunty ki punchy voice active hai.'
        : 'Gemini Key save ho gayi hai Sir. Bunty voice ke liye ElevenLabs key bhi daal sakte hain.';
      addMsg('ai', msg);
      speak(msg);
    }

    /* ================= ELEVENLABS BUNTY VOICE + AUTO FALLBACK ================= */
    function stopSpeaking() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('statusDot').classList.remove('speaking');
      document.getElementById('liveHalo').classList.remove('speaking');
    }

    function fallbackBrowserSpeak(text) {
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.pitch = 1.02;
      utter.rate = 1.08;
      const voices = window.speechSynthesis.getVoices();
      const maleHindi = voices.find(v => v.lang.includes('hi') && v.name.toLowerCase().includes('male'))
        || voices.find(v => v.lang.includes('hi-IN'));
      if (maleHindi) utter.voice = maleHindi;

      const dot = document.getElementById('statusDot');
      const halo = document.getElementById('liveHalo');
      utter.onstart = () => { dot.classList.add('speaking'); halo.classList.add('speaking'); };
      utter.onend = () => { dot.classList.remove('speaking'); halo.classList.remove('speaking'); };
      window.speechSynthesis.speak(utter);
    }

    async function speak(text) {
      stopSpeaking();
      const cleanText = text.replace(/```[\s\S]*?```/g, 'Code screen par likh diya hai Sir.').replace(/[*#_`]/g, '').trim();
      if (!cleanText) return;

      if (useBuntyEL && elApiKey) {
        const dot = document.getElementById('statusDot');
        const halo = document.getElementById('liveHalo');
        try {
          dot.classList.add('speaking');
          halo.classList.add('speaking');
          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${BUNTY_VOICE_ID}`, {
            method: 'POST',
            headers: {
              'xi-api-key': elApiKey,
              'Content-Type': 'application/json',
              'Accept': 'audio/mpeg'
            },
            body: JSON.stringify({
              text: cleanText,
              model_id: 'eleven_multilingual_v2',
              voice_settings: { stability: 0.45, similarity_boost: 0.80, style: 0.45, use_speaker_boost: true }
            })
          });
          if (!res.ok) throw new Error('ElevenLabs HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          currentAudio = new Audio(url);
          currentAudio.onended = () => {
            dot.classList.remove('speaking');
            halo.classList.remove('speaking');
            URL.revokeObjectURL(url);
          };
          currentAudio.onerror = () => {
            dot.classList.remove('speaking');
            halo.classList.remove('speaking');
          };
          await currentAudio.play();
          return;
        } catch (err) {
          dot.classList.remove('speaking');
          halo.classList.remove('speaking');
          fallbackBrowserSpeak(cleanText);
          return;
        }
      }
      fallbackBrowserSpeak(cleanText);
    }

    async function getModels() {
      if (cachedModel) return [cachedModel];
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
        const data = await res.json();
        if (res.ok && Array.isArray(data.models)) {
          const valid = data.models
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace('models/', ''));
          const preferred = valid.filter(n => n.includes('flash') && !n.includes('8b') && !n.includes('lite'));
          const others = valid.filter(n => n.includes('gemini'));
          return [...new Set([...preferred, ...others])];
        }
      } catch (e) {}
      return ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash-lite'];
    }

    function buildConversationContents(currentParts) {
      const chat = chats.find(c => c.id === currentChatId);
      const contents = [];
      if (chat && chat.messages.length > 1) {
        const recent = chat.messages.slice(-7, -1);
        recent.forEach(m => {
          contents.push({
            role: m.sender === 'user' ? 'user' : 'model',
            parts: [{ text: m.text }]
          });
        });
      }
      contents.push({ role: 'user', parts: currentParts });
      return contents;
    }

    async function callGemini(text, mode, fileObj) {
      const models = await getModels();
      let lastError = 'Model error';
      const parts = [];
      if (fileObj && fileObj.base64) {
        parts.push({ inlineData: { mimeType: fileObj.mimeType, data: fileObj.base64 } });
      }
      parts.push({ text: text || 'Is image/file ko detail mein samjhaiye.' });

      const contents = buildConversationContents(parts);

      for (const model of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT + "\nCurrent Mode: " + mode }] },
              contents
            })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            cachedModel = model;
            return { ok: true, text: data.candidates[0].content.parts[0].text };
          }
          lastError = data?.error?.message || `HTTP ${res.status}`;
        } catch (err) {
          lastError = err.message;
        }
      }
      return { ok: false, error: lastError };
    }

    async function sendMessage(customText) {
      const input = document.getElementById('userInput');
      const rawText = customText || input.value.trim();
      const fileToSend = selectedFile;
      const prefixToUse = activeToolPrefix;
      if (!rawText && !fileToSend) return;

      if (!customText) input.value = '';
      clearToolAndFile();
      addMsg('user', rawText || 'Attachment', fileToSend ? fileToSend.name : '');

      if (prefixToUse === '__IMAGE__') {
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(rawText)}?width=768&height=768&nologo=true&seed=${Date.now()}`;
        const reply = `Yeh rahi aapki generated image Sir: "${rawText}"`;
        addMsg('ai', reply, '', imgUrl);
        speak(reply);
        return;
      }

      if (!apiKey) {
        document.getElementById('settingsPanel').classList.add('open');
        addMsg('ai', 'Sir, pehle Settings mein apni Gemini API Key paste karke Save dabaiye.');
        return;
      }

      document.getElementById('statusText').innerText = 'Thinking...';
      const mode = document.getElementById('modeSelect').value;
      const promptFinal = prefixToUse ? (prefixToUse + rawText) : rawText;
      const result = await callGemini(promptFinal, mode, fileToSend);
      document.getElementById('statusText').innerText = 'JARVIS Core';

      if (result.ok) {
        addMsg('ai', result.text);
        speak(result.text);
      } else {
        addMsg('ai', `Sorry Sir, API error: ${result.error}`);
      }
    }

    function startVoiceOnce() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('Chrome browser use karein.'); return; }
      const rec = new SR();
      rec.lang = 'hi-IN';
      const dot = document.getElementById('statusDot');
      dot.classList.add('listening');
      document.getElementById('statusText').innerText = 'Listening...';
      rec.onresult = (e) => {
        playSound('chime');
        dot.classList.remove('listening');
        document.getElementById('statusText').innerText = 'JARVIS Core';
        sendMessage(e.results[0][0].transcript);
      };
      rec.onerror = () => {
        dot.classList.remove('listening');
        document.getElementById('statusText').innerText = 'JARVIS Core';
      };
      rec.start();
    }

    /* ================= LIVE HALO RING + CAMERA + SCREEN SHARE ================= */
    function openLiveMode() {
      document.getElementById('liveModal').classList.add('open');
      document.getElementById('liveSubtitle').innerText = 'Tap Mic to talk in Bunty voice, or enable Camera / Screen Live';
    }

    function stopLiveTracks() {
      if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
      const vid = document.getElementById('liveVideo');
      vid.srcObject = null;
      vid.style.display = 'none';
      document.getElementById('liveHalo').style.display = 'flex';
      isCameraOn = false;
      isScreenOn = false;
      document.getElementById('btnCam').classList.remove('active');
      document.getElementById('btnScreen').classList.remove('active');
    }

    function closeLiveMode() {
      stopLiveTracks();
      stopSpeaking();
      document.getElementById('liveModal').classList.remove('open');
    }

    async function toggleCamera() {
      if (isCameraOn) { stopLiveTracks(); document.getElementById('liveModeLabel').innerText = 'AURA Live'; return; }
      stopLiveTracks();
      try {
        liveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: false });
        const vid = document.getElementById('liveVideo');
        vid.srcObject = liveStream;
        vid.style.display = 'block';
        document.getElementById('liveHalo').style.display = 'none';
        isCameraOn = true;
        document.getElementById('btnCam').classList.add('active');
        document.getElementById('liveModeLabel').innerText = facingMode === 'environment' ? 'Back Camera' : 'Front Camera';
        document.getElementById('liveSubtitle').innerText = 'Camera active. Tap Mic and ask about what you see.';
      } catch (err) { alert('Camera permission allow karein: ' + err.message); }
    }

    async function switchCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      if (isCameraOn) { isCameraOn = false; await toggleCamera(); }
      else { await toggleCamera(); }
    }

    async function toggleScreenShare() {
      if (isScreenOn) { stopLiveTracks(); document.getElementById('liveModeLabel').innerText = 'AURA Live'; return; }
      stopLiveTracks();
      try {
        liveStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const vid = document.getElementById('liveVideo');
        vid.srcObject = liveStream;
        vid.style.display = 'block';
        document.getElementById('liveHalo').style.display = 'none';
        isScreenOn = true;
        document.getElementById('btnScreen').classList.add('active');
        document.getElementById('liveModeLabel').innerText = 'Screen Live';
        document.getElementById('liveSubtitle').innerText = 'Screen sharing active. Tap Mic to ask.';
      } catch (err) { alert('Screen share cancel ya unsupported: ' + err.message); }
    }

    function captureCurrentFrame() {
      if (!isCameraOn && !isScreenOn) return null;
      const vid = document.getElementById('liveVideo');
      const canvas = document.getElementById('captureCanvas');
      if (!vid.videoWidth) return null;
      canvas.width = vid.videoWidth;
      canvas.height = vid.videoHeight;
      canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
      return {
        name: isScreenOn ? 'live_screen.jpg' : 'live_camera.jpg',
        mimeType: 'image/jpeg',
        base64: canvas.toDataURL('image/jpeg', 0.8).split(',')[1]
      };
    }

    function listenInLiveMode() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('Chrome browser use karein.'); return; }
      const rec = new SR();
      rec.lang = 'hi-IN';
      const micBtn = document.getElementById('btnLiveMic');
      const halo = document.getElementById('liveHalo');
      micBtn.classList.add('active');
      halo.classList.add('listening');
      document.getElementById('liveSubtitle').innerText = 'Listening...';

      rec.onresult = async (e) => {
        playSound('chime');
        micBtn.classList.remove('active');
        halo.classList.remove('listening');
        const spoken = e.results[0][0].transcript;
        document.getElementById('liveSubtitle').innerText = spoken;

        const frameObj = captureCurrentFrame();
        addMsg('user', spoken, frameObj ? frameObj.name : '');

        if (!apiKey) {
          document.getElementById('liveSubtitle').innerText = 'Save Gemini API Key in Settings first.';
          return;
        }

        document.getElementById('liveSubtitle').innerText = 'Processing...';
        const mode = document.getElementById('modeSelect').value;
        const result = await callGemini(spoken, mode, frameObj);

        if (result.ok) {
          document.getElementById('liveSubtitle').innerText = result.text;
          addMsg('ai', result.text);
          speak(result.text);
        } else {
          document.getElementById('liveSubtitle').innerText = 'Error: ' + result.error;
        }
      };

      rec.onerror = () => {
        micBtn.classList.remove('active');
        halo.classList.remove('listening');
        document.getElementById('liveSubtitle').innerText = 'Could not hear clearly. Tap Mic again.';
      };
      rec.start();
    }

    function faceUnlockGreet() {
      document.getElementById('settingsPanel').classList.remove('open');
      sendMessage('Maine abhi Face Unlock se phone khola hai, mujhe apne punchy Bunty andaaz mein welcome karo!');
    }

    function simulateMessage() {
      document.getElementById('settingsPanel').classList.remove('open');
      const alertText = 'Sir, WhatsApp par ek naya message aaya hai. Kya main padh kar sunaun?';
      addMsg('ai', alertText);
      speak(alertText);
    }

    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        bat.addEventListener('chargingchange', () => {
          playSound('chime');
          const msg = bat.charging ? 'Sir, charging shuru ho gayi hai.' : 'Sir, charger disconnect kar diya gaya hai.';
          addMsg('ai', msg);
          speak(msg);
        });
      });
    }

    window.onload = () => {
      if (chats.length === 0) createNewChat();
      else { currentChatId = chats[0].id; renderSidebar(); renderChat(); }
    };
  </script>
