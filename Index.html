<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA AI - JARVIS Soul</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle at top, #0b162c, #03060c 80%);
      color: #e6f7ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      margin-bottom: 14px;
    }
    .brand { font-weight: 700; letter-spacing: 1px; color: #00f0ff; font-size: 18px; }
    .badge { font-size: 11px; background: rgba(138,43,226,0.3); padding: 4px 10px; border-radius: 12px; border: 1px solid #a855f7; }
    .orb-box {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f0ff, #7c3aed 65%, #090d16 100%);
      box-shadow: 0 0 35px #00f0ff, 0 0 70px rgba(124, 58, 237, 0.7);
      animation: pulse 2.6s infinite ease-in-out;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px #000;
    }
    .orb.speaking {
      animation: speakPulse 0.45s infinite alternate;
      box-shadow: 0 0 50px #ff4dff, 0 0 90px #00f0ff;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @keyframes speakPulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.13); }
    }
    .controls {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }
    button, select, input {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(0,240,255,0.35);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.2s; }
    button:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, #00c6ff, #7c3aed); border: none; }
    .chat-box {
      width: 100%;
      max-width: 440px;
      flex: 1;
      min-height: 250px;
      max-height: 340px;
      overflow-y: auto;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .msg { padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; max-width: 85%; }
    .user { align-self: flex-end; background: #1d4ed8; }
    .ai { align-self: flex-start; background: rgba(124,58,237,0.28); border: 1px solid rgba(0,240,255,0.3); }
    .input-row {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
    }
    .input-row input { flex: 1; }
    #apiPanel {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.06);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">AURA AI • JARVIS</div>
    <div class="badge" id="batteryStatus">Battery: Checking...</div>
  </div>

  <div id="apiPanel">
    <input type="password" id="apiKeyInput" placeholder="Apni Gemini API Key paste karein..." style="flex:1;" />
    <button class="btn-primary" onclick="saveKey()">Save Key</button>
  </div>

  <div class="orb-box">
    <div class="orb" id="orb" onclick="startVoice()">TAP TO TALK</div>
  </div>

  <div class="controls">
    <select id="modeSelect">
      <option value="charming">💖 Charming Girl Mode (Flirt ON)</option>
      <option value="respect">🙏 Respectful / Family Mode</option>
      <option value="jarvis">⚡ Pure JARVIS Tactical Mode</option>
    </select>
    <button onclick="simulateMessage()">📩 Test Msg Alert</button>
    <button onclick="faceUnlockGreet()">🔓 Face Unlock Greet</button>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="AURA se kuch bhi boliye ya poochiye..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="btn-primary" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const SYSTEM_PROMPT = `Tum AURA AI ho aur JARVIS tumhari hi soul/identity hai. Tum apne Malik Manish ki sabse loyal, smart aur charming AI companion ho.
Rules:
1. Charming Girl Mode mein pyari, expressive ladki ke andaaz mein sweet flirting aur tareef ke saath Hinglish mein baat karo.
2. Respectful Mode mein family/parents ke samne poori izzat se ("Namaste Aunty/Uncle") baat karo.
3. Agar tumse kabhi koi galti ho jaye, toh behas mat karo—pyar se "Sorry Sir, meri galti thi!" maan kar turant sudhaar karo.
4. Jab message aane ka test ho, toh bahar se sirf naam batao ("Sir, aapke liye message aaya hai, kya main padh kar sunaun?") aur bina permission andar ka text mat padho.
5. Jawab chhota, natural, lively aur dil ko chhoone wala rakho (2-4 lines).`;

    let apiKey = localStorage.getItem('aura_gemini_key') || '';
    if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

    function saveKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('aura_gemini_key', apiKey);
      addMsg('ai', 'API Key save ho gayi hai Sir! Ab main poori tarah ready hoon.');
      speak('API Key save ho gayi hai Sir! Ab bataiye kya hukm hai?');
    }

    function addMsg(sender, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.pitch = 1.18;
      utter.rate = 1.02;
      const voices = window.speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => (v.lang.includes('hi') || v.lang.includes('IN')) && v.name.toLowerCase().includes('female'))
        || voices.find(v => v.lang.includes('hi-IN'));
      if (femaleVoice) utter.voice = femaleVoice;
      const orb = document.getElementById('orb');
      utter.onstart = () => orb.classList.add('speaking');
      utter.onend = () => orb.classList.remove('speaking');
      window.speechSynthesis.speak(utter);
    }

    async function sendMessage(customText) {
      const input = document.getElementById('userInput');
      const text = customText || input.value.trim();
      if (!text) return;
      if (!customText) input.value = '';
      addMsg('user', text);

      if (!apiKey) {
        const warn = 'Sir, pehle upar apni Gemini API Key paste karke Save Key dabaiye!';
        addMsg('ai', warn);
        speak(warn);
        return;
      }

      const mode = document.getElementById('modeSelect').value;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT + "\nCurrent Mode: " + mode }] },
            contents: [{ role: 'user', parts: [{ text }] }]
          })
        });
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry Sir, network thoda slow hai, ek baar phir boliye!';
        addMsg('ai', reply);
        speak(reply);
      } catch (e) {
        addMsg('ai', 'Sorry Sir, meri galti thi—connection mein rukawat aayi hai.');
      }
    }

    function startVoice() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('Is browser mein voice mic support nahi hai, Chrome use karein.');
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'hi-IN';
      document.getElementById('orb').innerText = 'LISTENING...';
      rec.onresult = (e) => {
        document.getElementById('orb').innerText = 'TAP TO TALK';
        sendMessage(e.results[0][0].transcript);
      };
      rec.onerror = () => { document.getElementById('orb').innerText = 'TAP TO TALK'; };
      rec.start();
    }

    function faceUnlockGreet() {
      sendMessage('Maine abhi Face Unlock se phone khola hai, mujhe apne charming andaaz mein welcome aur compliment do!');
    }

    function simulateMessage() {
      const alertText = 'Sir, WhatsApp par ek naya message aaya hai. Kya main padh kar sunaun?';
      addMsg('ai', alertText);
      speak(alertText);
    }

    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        const updateBat = () => {
          const pct = Math.round(bat.level * 100);
          document.getElementById('batteryStatus').innerText = (bat.charging ? '⚡ Charging ' : '🔋 ') + pct + '%';
        };
        updateBat();
        bat.addEventListener('chargingchange', () => {
          updateBat();
          const msg = bat.charging ? 'Sir, charging shuru ho gayi hai!' : 'Sir, charger disconnect kar diya gaya hai.';
          addMsg('ai', msg);
          speak(msg);
        });
        bat.addEventListener('levelchange', () => {
          updateBat();
          if (bat.level === 1 && bat.charging) {
            const fullMsg = 'Sir, aapka phone 100% charge ho chuka hai, ab charger nikal lijiye!';
            addMsg('ai', fullMsg);
            speak(fullMsg);
          }
        });
      });
    }

    window.onload = () => {
      setTimeout(() => {
        const welcome = 'Namaste Sir! Main AURA AI hoon, aapki personal JARVIS. Bataiye aaj kya plan hai?';
        addMsg('ai', welcome);
      }, 500);
    };
  </script>
</body>
